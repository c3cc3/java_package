# Agnet.properties
##################################
# FileQueue logger
log.file=/logs/fq/fqueue_agent.log
log.level=5
##################################
# FileQueue
queue.path=/sendq1/enmq
queue.input=KT_SM_ONL
queue.output=XMS_HIST_RSLT
# Create this dedicated queue using fqm before starting the agent.
queue.error=TST
##################################
# Agent timing
dequeue.idle.ms=200
retry.delay.ms=500
worker.shutdown.timeout.seconds=30
##################################
# Map files (run from project root)
map.sms=/ums24/wiseu/fq/project_src/jni/conf/maps/sms.map
map.lms=/ums24/wiseu/fq/project_src/jni/conf/maps/lms.map
map.mms=/ums24/wiseu/fq/project_src/jni/conf/maps/mms.map
map.ack=/ums24/wiseu/fq/project_src/jni/conf/maps/ack.map
map.result=/ums24/wiseu/fq/project_src/jni/conf/maps/result.map
