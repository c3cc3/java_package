# Agnet.properties
##################################
# FileQueue logger
log.file=/logs/fq/fqueue_agent.log
log.level=5
##################################
# FileQueue
queue.path=/sendq1/enmq
queue.input=KT_SM_ONL
queue.output=XMS_HIST_RSLT
##################################
# Agent timing
dequeue.idle.ms=200
retry.delay.ms=500
worker.shutdown.timeout.seconds=30
##################################
# Bundle/Worker Settings
bundle.size=400
bundle.flush.ms=20
#
bundle.queue.capacity=100
worker.count=32
worker.queue.capacity=1000
##################################
